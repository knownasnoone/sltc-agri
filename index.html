<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- STRICT Viewport Lock: Prevents pinch-zoom and scaling on mobile/tablets -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SLTC AgriPulse UI - Kiosk Device 03</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <!-- MQTT.js: lets this page talk to the ESP32 rotating table over HiveMQ -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  
  <style>
    /* 1. KIOSK BASE SETTINGS */
    body, html {
      -webkit-user-select: none; 
      user-select: none; 
      touch-action: pan-y; 
      overflow: hidden; /* Prevents whole-page bouncing */
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
    }

    /* 2. VIDEO WATERMARK HIDER */
    .bg-video {
      transform: scale(1.05); /* Zooms video in by 5% to crop out corner watermarks */
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Force hide the bottom-right logo class just in case */
    .kiosk-logo, .brand-sub-logo {
      display: none !important;
    }

    /* 3. HARDWARE BUTTONS (Default Tablet/Desktop) */
    .table-controls {
      position: fixed;
      bottom: 15px;
      left: 15px;
      z-index: 1000;
      display: flex;
      gap: 10px;
    }

    .table-controls button {
      padding: 8px 14px !important; 
      font-size: 12px !important;    
      border-radius: 6px !important; 
      border: 1px solid rgba(255,255,255,0.2) !important;
      white-space: nowrap;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4) !important;
    }

    /* 4. BULLETPROOF SCROLLABLE VIEWS (Fixes Oscal Pad / Android clipping) */
    .kiosk-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }

    .view-state {
      flex: 1; /* Automatically takes up exactly the remaining screen height */
      overflow-y: auto; /* Enables scrolling ONLY in this section */
      -webkit-overflow-scrolling: touch;
      padding-bottom: 90px; /* Prevents text from hiding behind bottom buttons */
      width: 100%;
    }

    /* Text Wrapping Fixes for Descriptions */
    .detail-card {
      margin: 0 auto;
      width: 95%;
      max-width: 800px;
      word-wrap: break-word; /* Forces long words to wrap */
      overflow-wrap: break-word;
    }

    #prod-desc {
      font-size: 1.05rem !important;
      line-height: 1.6 !important;
      white-space: pre-wrap; /* Honors paragraph breaks from your .txt files */
    }

    #prod-highlights li {
      font-size: 0.95rem !important;
      margin-bottom: 8px;
      line-height: 1.4;
    }

    /* 5. MOBILE & SMALL TABLET OPTIMIZATIONS */
    @media (max-width: 820px) {
      /* Scale down Headers */
      .app-header .main-title { font-size: 1.4rem !important; margin-bottom: 5px; text-align: center; }
      .app-header .sub-title { font-size: 0.85rem !important; text-align: center; padding: 0 10px; }
      .brand-badge { flex-direction: row; justify-content: center; transform: scale(0.8); margin-bottom: 0; }
      
      /* Make Grid stack better on mobile */
      .products-grid { 
        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)) !important; 
        gap: 10px !important; 
        padding: 10px !important;
      }
      .card-btn { padding: 12px 8px !important; min-height: 75px !important; }
      .card-number { font-size: 1.3rem !important; }
      .card-label { font-size: 0.85rem !important; }

      /* Detail Card Text Optimization */
      .split-container { padding: 5px !important; }
      .detail-card { width: 100% !important; padding: 15px 12px !important; }
      #prod-title { font-size: 1.3rem !important; }
      #prod-subtitle { font-size: 0.95rem !important; }
      #prod-desc { font-size: 0.9rem !important; }
      #prod-highlights li { font-size: 0.85rem !important; }

      /* Table Controls Full Width on Mobile */
      .table-controls {
        left: 0;
        bottom: 0;
        width: 100%;
        background: rgba(0,0,0,0.85);
        backdrop-filter: blur(10px);
        padding: 10px;
        gap: 8px;
        justify-content: space-between;
        box-sizing: border-box;
      }
      .table-controls button {
        flex: 1;
        text-align: center;
        white-space: normal; /* Allows text to wrap to 2 lines if needed */
        font-size: 11px !important;
        padding: 10px 5px !important;
      }
    }
  </style>
</head>
<body>

  <!-- BACKGROUND VIDEO LAYER -->
  <div class="bg-video-container">
    <video class="bg-video" autoplay loop muted playsinline>
      <source src="assets/Background.mp4" type="video/mp4">
    </video>
  </div>

  <div class="bg-overlay"></div>

  <div class="kiosk-container">

    <!-- Small MQTT connection indicator for on-site debugging -->
    <div id="mqtt-status-dot" title="Table connection status" style="position:fixed; top:10px; left:10px; width:10px; height:10px; border-radius:50%; background:#E53935; z-index:999; box-shadow:0 0 4px rgba(0,0,0,0.4);"></div>

    <button id="theme-toggle" class="theme-toggle-btn" onclick="handleThemeTouch()" aria-label="Toggle Theme">
      <svg class="sun-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
      <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>

    <header class="app-header">
      <div class="brand-badge">
        <img src="assets/top logo.svg" alt="SLTC Knowledge Hub Logo" class="header-logo">
        <div class="logo-divider"></div>
        <img src="assets/top logo 2.png" alt="Pro Food Pro Pack Logo" class="header-logo-secondary">
      </div>
      <h1 class="main-title">ProFood ProPack & AgBiz</h1>
      <p class="sub-title">Where Agriculture and the Food Industry Meet Tomorrow.</p>
    </header>

    <main id="idle-view" class="view-state active">
      <div class="cta-banner">
        <span class="pulse-dot"></span>
        <p>TOUCH A PRODUCT TO EXPLORE</p>
      </div>
      <div id="product-grid" class="products-grid"></div>
    </main>

    <main id="active-view" class="view-state hidden">
      <button onclick="closeDetails()" class="back-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Back to Products
      </button>

      <div class="split-container">
        <div class="detail-card">
          <span id="prod-badge" class="badge">Product 01</span>
          <h2 id="prod-title">Product Title</h2>
          <p id="prod-subtitle" class="subtitle">Innovation Concept Subtitle</p>
          <hr class="divider">
          <p id="prod-desc" class="description">Product full description will appear here...</p>
          
          <div class="highlights-container">
            <h3>Key Features</h3>
            <ul id="prod-highlights"></ul>
          </div>
        </div>
      </div>
    </main>

    <!-- Table Hardware Controls -->
    <div class="table-controls">
      <button onclick="publishMessage('sltc-agripulse-kiosk/control', 'CONT')" style="background: rgba(0, 123, 255, 0.8); color: white; font-weight: bold; cursor: pointer;">
        Continuous Rotation
      </button>
      
      <button onclick="publishMessage('sltc-agripulse-kiosk/control', 'E-STOP')" style="background: rgba(220, 53, 69, 0.9); color: white; font-weight: bold; cursor: pointer;">
        EMERGENCY STOP
      </button>
    </div>

  </div>

  <script src="js/config-dev3.js"></script>
  <script src="js/app.js"></script>
  
  <!-- Sparks Layer -->
  <div class="sparks-container">
      <div class="spark"></div>
      <div class="spark"></div>
      <div class="spark"></div>
      <div class="spark"></div>
      <div class="spark"></div>
      <div class="spark"></div>
      <div class="spark"></div>
      <div class="spark"></div>
      <div class="spark"></div>
      <div class="spark"></div>
  </div>
</body>
</html>
