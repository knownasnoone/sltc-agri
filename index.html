<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- STRICT Viewport Lock: prevents pinch-zoom, scaling, bounce; viewport-fit=cover enables safe-area insets on notched/rounded tablet screens -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>SLTC AgriPulse UI - Kiosk Device 03</title>

  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <!-- MQTT.js -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

  <style>
    /* ==========================================================
       0. TABLET-FRIENDLY TOKENS
       Fluid clamp() values scale smoothly between phone, tablet
       portrait, tablet landscape and desktop kiosk widths instead
       of jumping at a single 820px breakpoint.
       ========================================================== */
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);

      --fs-title: clamp(1.3rem, 1rem + 1.6vw, 2rem);
      --fs-subtitle: clamp(0.85rem, 0.75rem + 0.5vw, 1.05rem);
      --fs-body: clamp(0.95rem, 0.85rem + 0.4vw, 1.1rem);
      --fs-card-num: clamp(1.15rem, 1rem + 0.8vw, 1.5rem);
      --fs-card-label: clamp(0.8rem, 0.7rem + 0.4vw, 0.95rem);
      --fs-btn: clamp(0.78rem, 0.7rem + 0.35vw, 0.95rem);

      --touch-min: 48px; /* WCAG/Apple/Material minimum comfortable touch target */
      --controls-h: 84px; /* actual rendered height of fixed bottom control bar, kept in sync via JS below */
    }

    /* 1. UNIVERSAL BOX-SIZING FIX */
    * {
      box-sizing: border-box !important;
      -webkit-tap-highlight-color: transparent;
    }

    /* 2. KIOSK BASE SETTINGS */
    body, html {
      -webkit-user-select: none;
      user-select: none;
      touch-action: pan-y;
      overflow: hidden !important;
      width: 100vw;
      /* dvh accounts for mobile/tablet browser chrome collapsing; vh is the safe fallback */
      height: 100vh;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overscroll-behavior: none;
    }

    /* 3. VIDEO WATERMARK HIDER */
    .bg-video {
      transform: scale(1.05); /* Zooms video in by 5% to crop out corner watermarks */
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Ensure no residual logos appear */
    .kiosk-logo, .brand-sub-logo {
      display: none !important;
      opacity: 0 !important;
      visibility: hidden !important;
    }

    /* 4. MAIN LAYOUT ENGINE */
    .kiosk-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      position: absolute;
      top: 0; left: 0;
      padding-top: var(--safe-top);
      padding-left: var(--safe-left);
      padding-right: var(--safe-right);
    }

    .app-header {
      flex-shrink: 0;
      padding: clamp(8px, 1.5vh, 16px) 10px !important;
    }

    .app-header .main-title {
      font-size: var(--fs-title) !important;
    }
    .app-header .sub-title {
      font-size: var(--fs-subtitle) !important;
    }

    /* View States (Idle vs Active) */
    .view-state {
      flex: 1;
      width: 100%;
      min-height: 0 !important;
      display: none;
      flex-direction: column;
    }
    .view-state.active {
      display: flex !important;
    }

    #idle-view {
      overflow-y: auto !important;
      -webkit-overflow-scrolling: touch;
      /* room for the fixed control bar + safe-area, not a hardcoded 90px */
      padding-bottom: calc(var(--controls-h) + var(--safe-bottom) + 16px);
    }

    #active-view {
      padding: 15px 0 !important;
      overflow: hidden !important;
    }

    /* 5. BACK BUTTON — sized as a real touch target, aligned with description card */
    .back-btn {
      margin: 0 auto 15px auto !important;
      width: 95%;
      max-width: 800px;
      min-height: var(--touch-min);
      display: flex !important;
      justify-content: flex-start !important;
      align-items: center;
      gap: 8px;
      background: rgba(30, 30, 30, 0.95) !important;
      color: #ffffff !important;
      padding: 12px 20px !important;
      border-radius: 8px !important;
      border: 1px solid rgba(255,255,255,0.2) !important;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5) !important;
      font-weight: 600 !important;
      font-size: var(--fs-btn) !important;
      cursor: pointer;
    }

    /* 6. SCROLLABLE DESCRIPTION CARD */
    .split-container {
      flex: 1;
      width: 100%;
      overflow-y: auto !important;
      -webkit-overflow-scrolling: touch;
      padding-bottom: calc(var(--controls-h) + var(--safe-bottom) + 16px) !important;
    }

    .detail-card {
      margin: 0 auto;
      width: 95%;
      max-width: 800px;
      word-wrap: break-word;
      overflow-wrap: break-word;
      background: rgba(15, 20, 30, 0.85) !important;
      border-radius: 12px;
      padding: clamp(15px, 3vw, 25px) !important;
    }

    #prod-title { font-size: clamp(1.15rem, 1rem + 1vw, 1.6rem) !important; }
    #prod-subtitle { font-size: var(--fs-subtitle) !important; }
    #prod-desc {
      font-size: var(--fs-body) !important;
      line-height: 1.6 !important;
      white-space: pre-wrap;
    }

    /* 7. SYMMETRICAL, CENTERED HARDWARE BUTTONS — real touch targets, safe-area aware */
    .table-controls {
      position: fixed;
      bottom: calc(20px + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      display: flex;
      justify-content: center;
      align-items: stretch;
      gap: 15px;
      width: min(90%, 450px);
    }

    .table-controls button {
      flex: 1; /* equal widths */
      min-height: var(--touch-min);
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 12px 10px !important;
      font-size: var(--fs-btn) !important;
      border-radius: 8px !important;
      border: 1px solid rgba(255,255,255,0.2) !important;
      white-space: normal; /* lets text stack neatly if needed */
      line-height: 1.2;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4) !important;
      cursor: pointer;
    }

    /* 8. PRODUCT GRID — fluid by default, tuned per tier below */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: clamp(10px, 2vw, 20px);
      padding: 5px clamp(12px, 3vw, 24px);
    }
    .card-btn { min-height: var(--touch-min); }
    .card-number { font-size: var(--fs-card-num) !important; }
    .card-label { font-size: var(--fs-card-label) !important; }

    /* ==========================================================
       TIERED BREAKPOINTS
       Phone      : ≤ 600px
       Tablet     : 601px – 1024px  (covers iPad mini/Air/Pro portrait & most Android tablets)
       Tablet LS  : 1025px – 1366px AND orientation landscape (iPad Pro 11"/12.9" landscape etc.)
       Desktop    : > 1366px
       Using width-based tiers instead of a single max-height cutoff
       avoids the old rule silently skipping larger tablets in
       landscape (e.g. 1194×834, 1366×1024).
       ========================================================== */

    /* ---- Tablet portrait & general tablet tier ---- */
    @media (min-width: 601px) and (max-width: 1024px) {
      .brand-badge { transform: scale(0.85); }
      .products-grid {
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)) !important;
        gap: 16px !important;
      }
      .card-btn { padding: 16px 10px !important; min-height: 90px !important; }
      .table-controls { max-width: 500px; }
    }

    /* ---- Tablet landscape (wide short viewport) ---- */
    @media (min-width: 900px) and (max-width: 1366px) and (orientation: landscape) {
      .app-header { padding: 6px 10px !important; }
      .brand-badge { transform: scale(0.75); margin-top: -4px !important; margin-bottom: 0 !important; }
      .products-grid {
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)) !important;
        gap: 14px !important;
        padding: 5px 20px !important;
      }
      .card-btn { min-height: 78px !important; padding: 12px 8px !important; }
      #active-view { padding: 8px 0 !important; }
      .detail-card { padding: 18px !important; }
      .table-controls { bottom: calc(14px + var(--safe-bottom)); }
    }

    /* ---- Phone tier (kept from the original design, narrowed threshold) ---- */
    @media (max-width: 600px) {
      .app-header .main-title { text-align: center; }
      .app-header .sub-title { text-align: center; padding: 0 10px; }
      .brand-badge { flex-direction: row; justify-content: center; transform: scale(0.7); margin-bottom: 0 !important; margin-top: -5px !important; }

      .products-grid {
        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)) !important;
        gap: 10px !important;
        padding: 5px 12px !important;
        justify-content: center !important;
      }
      .card-btn { padding: 10px 8px !important; min-height: 72px !important; }

      #active-view { padding: 8px 0 !important; }
      .detail-card { padding: 14px !important; }

      .table-controls { bottom: calc(12px + var(--safe-bottom)); width: 95%; }
    }

    /* ---- Fine-grained short-landscape phones (e.g. phone rotated) ---- */
    @media (max-height: 420px) and (orientation: landscape) {
      .app-header { padding: 4px 10px !important; }
      .brand-badge { transform: scale(0.6); margin: 0 !important; }
      #active-view { padding: 6px 0 !important; }
      .table-controls { bottom: calc(8px + var(--safe-bottom)); }
    }

    /* ---- High-DPI tablet screens: keep hairline borders crisp ---- */
    @media (min-resolution: 2dppx) {
      .back-btn, .table-controls button, .detail-card {
        border-width: 0.5px !important;
      }
    }

    /* ---- Reduced motion preference (accessibility, also common on kiosk power-saving) ---- */
    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
    }
  </style>
</head>
<body>

  <!-- BACKGROUND VIDEO LAYER -->
  <div class="bg-video-container">
    <video class="bg-video" autoplay loop muted playsinline>
      <source src="assets/Background.mp4" type="video/mp4">
    </video>
  </div>

  <div class="bg-overlay"></div>

  <div class="kiosk-container">

    <!-- Small MQTT connection indicator -->
    <div id="mqtt-status-dot" title="Table connection status"
         style="position:fixed; top:calc(10px + env(safe-area-inset-top, 0px)); left:calc(10px + env(safe-area-inset-left, 0px)); width:10px; height:10px; border-radius:50%; background:#E53935; z-index:999; box-shadow:0 0 4px rgba(0,0,0,0.4);"></div>

    <button id="theme-toggle" class="theme-toggle-btn" onclick="handleThemeTouch()" aria-label="Toggle Theme"
            style="min-width:48px; min-height:48px;">
      <svg class="sun-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
      <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>

    <header class="app-header">
      <div class="brand-badge">
        <img src="assets/top logo.svg" alt="SLTC Knowledge Hub Logo" class="header-logo">
        <div class="logo-divider"></div>
        <img src="assets/top logo 2.png" alt="Pro Food Pro Pack Logo" class="header-logo-secondary">
      </div>
      <h1 class="main-title">ProFood ProPack & AgBiz</h1>
      <p class="sub-title">Where Agriculture and the Food Industry Meet Tomorrow.</p>
    </header>

    <main id="idle-view" class="view-state active">
      <div class="cta-banner">
        <span class="pulse-dot"></span>
        <p>TOUCH A PRODUCT TO EXPLORE</p>
      </div>
      <div id="product-grid" class="products-grid"></div>
    </main>

    <main id="active-view" class="view-state hidden">
      <button onclick="closeDetails()" class="back-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Back to Products
      </button>

      <div class="split-container">
        <div class="detail-card">
          <span id="prod-badge" class="badge">Product 01</span>
          <h2 id="prod-title">Product Title</h2>
          <p id="prod-subtitle" class="subtitle">Innovation Concept Subtitle</p>
          <hr class="divider">
          <p id="prod-desc" class="description">Product full description will appear here...</p>

          <div class="highlights-container">
            <h3>Key Features</h3>
            <ul id="prod-highlights"></ul>
          </div>
        </div>
      </div>
    </main>

    <!-- Table Hardware Controls (Perfectly Centered & Aligned, safe-area aware) -->
    <div class="table-controls">
      <button onclick="publishMessage('sltc-agripulse-kiosk/control', 'CONT')" style="background: rgba(0, 123, 255, 0.8); color: white; font-weight: bold;">
        Continuous Rotation
      </button>
      <button onclick="publishMessage('sltc-agripulse-kiosk/control', 'E-STOP')" style="background: rgba(220, 53, 69, 0.9); color: white; font-weight: bold;">
        EMERGENCY STOP
      </button>
    </div>

  </div>

  <script src="js/config-dev3.js"></script>
  <script src="js/app.js"></script>

  <script>
    // Keep --controls-h in sync with the real rendered height of the bottom bar
    // so content padding never overlaps or leaves an oversized gap on any
    // tablet's font-scale / accessibility text-size setting.
    function syncControlsHeight() {
      var el = document.querySelector('.table-controls');
      if (el) {
        document.documentElement.style.setProperty('--controls-h', el.offsetHeight + 'px');
      }
    }
    window.addEventListener('load', syncControlsHeight);
    window.addEventListener('resize', syncControlsHeight);
    window.addEventListener('orientationchange', function () {
      // slight delay lets the browser finish reflow after rotation
      setTimeout(syncControlsHeight, 150);
    });
  </script>

  <!-- Sparks Layer -->
  <div class="sparks-container">
      <div class="spark"></div>
      <div class="spark"></div>
      <div class="spark"></div>
      <div class="spark"></div>
      <div class="spark"></div>
      <div class="spark"></div>
      <div class="spark"></div>
      <div class="spark"></div>
      <div class="spark"></div>
      <div class="spark"></div>
  </div>
</body>
</html>
